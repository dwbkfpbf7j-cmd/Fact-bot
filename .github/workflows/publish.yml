

name: Fact Bot Publisher

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fact-bot-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

     
      - name: Save publication history and statistics
        if: always()
        run: |
          git config user.name "Fact Bot"
          git config user.email "fact-bot@users.noreply.github.com"

          if [ -f posted.json ]; then
            git add posted.json
          fi

          if [ -f tracking.json ]; then
            git add tracking.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update Fact Bot history and statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to save."
          fi
